<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c5148">
  <meta name="description" content="在杭州湖滨地图上选择约会店铺，查看沿真实步行路网连接的路线。点击点和线展开详情，联动时长、双人预算与路线播放。">
  <title>湖滨雨天约会地图 · 一起慢慢逛</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./style.css?v=2">
  <script src="./vendor/leaflet/leaflet.js" defer></script>
  <script src="./planner-core.js?v=2" defer></script>
  <script src="./app.js?v=2" defer></script>
</head>
<body>
  <main id="map" aria-label="湖滨约会地图，可拖动、缩放，点击店铺和步行路线查看详情"></main>
  <header class="map-brand floating"><a class="brand-home" href="../" aria-label="返回Web Lab">☂</a><div><h1>一起慢慢逛<span>湖滨约会地图</span></h1><p>地图选点，顺着真实道路走。</p></div><button id="help-button" class="round-button" aria-label="地图说明与资料">?</button></header>
  <div class="top-actions"><button id="journey-button" class="floating action-button">行程 <span id="stop-count">4</span></button><button id="share-button" class="floating action-button">分享 ↗</button></div>
  <section class="map-chooser floating" aria-label="选择约会路线和店铺类别">
    <div class="preset-row" role="group" aria-label="路线预设"><button data-preset="board" class="active" aria-pressed="true">⚄ 轻桌游</button><button data-preset="craft" aria-pressed="false">▦ 拼豆手作</button><button data-preset="stroll" aria-pressed="false">✳ 轻松逛逛</button><button data-preset="custom" aria-pressed="false">自己选</button></div>
    <div class="category-row" role="group" aria-label="地图店铺筛选"><button data-category="all" class="active" aria-pressed="true">全部</button><button data-category="shop" aria-pressed="false">好逛</button><button data-category="play" aria-pressed="false">好玩</button><button data-category="book" aria-pressed="false">书店</button><span class="chooser-hint">点地图上的店铺选入行程</span></div>
  </section>
  <nav class="map-tools" aria-label="地图工具"><button id="fit-button" class="floating tool-button" title="显示所有店铺" aria-label="显示所有店铺">⊞</button><button id="base-button" class="floating tool-button" title="切换标准街道底图" aria-label="切换标准街道底图" aria-pressed="false">▧</button><button id="zoom-in" class="floating tool-button" aria-label="放大地图">＋</button><button id="zoom-out" class="floating tool-button" aria-label="缩小地图">−</button></nav>
  <div id="map-status" class="map-status" role="status">正在展开湖滨地图…</div>
  <div class="map-instruction" id="map-instruction"><span class="instruction-dot"></span><span>点店铺选站点 · 点路线看走法 · 拖动地图探索</span><button id="dismiss-instruction" aria-label="关闭使用提示">×</button></div>
  <section id="trip-summary" class="trip-summary floating" aria-label="所选行程概览" aria-live="polite">
    <div class="summary-heading"><span><i class="status-dot"></i><strong id="plan-title">少淋雨 · 轻桌游</strong></span><button id="settings-button" class="text-button">调整时间 / 晚饭</button></div>
    <div class="summary-metrics"><div><strong id="walk-total">—</strong><span>道路步行</span></div><div><strong id="duration-total">—</strong><span id="time-range">15:00出发</span></div><div><strong id="budget-total">—</strong><span>双人预留</span></div></div>
    <div class="summary-footer"><button id="play-button" class="play-button" disabled><span id="play-icon">▶</span><span id="play-label">播放走法</span></button><span id="preview-status">沿真实道路坐标加速预览</span></div>
  </section>
  <aside id="detail-panel" class="detail-panel floating" aria-label="当前地图要素详情" hidden>
    <div class="panel-header"><span id="panel-eyebrow">地图详情</span><button id="close-panel" class="round-button" aria-label="关闭详情">×</button></div><div id="panel-content" class="panel-content"></div>
  </aside>
  <footer class="data-attribution"><span>底图 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> · 路线 <a href="https://routing.openstreetmap.de/about.html" target="_blank" rel="noopener noreferrer">FOSSGIS / OSRM（步行）</a> · 2026.11.09</span><span class="attribution-extra">商场用建筑代表点，楼内换层另计 · <a href="https://www.openstreetmap.org/fixthemap" target="_blank" rel="noopener noreferrer">反馈地图</a></span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="copy-dialog"><form method="dialog"><h2>复制当前方案</h2><textarea id="copy-fallback" readonly aria-label="可复制的方案内容"></textarea><button class="primary-button">完成</button></form></dialog>
  <noscript><div class="fatal-message">这张交互地图需要开启 JavaScript。<a href="https://uri.amap.com/search?keyword=杭州湖滨银泰in77&city=杭州&view=map">打开高德查看湖滨商圈 ↗</a></div></noscript>
</body>
</html>
